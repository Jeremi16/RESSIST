name: docker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "bot/**"
      - ".github/workflows/docker.yml"
  # Test gate harus jalan SEBELUM merge, bukan hanya sesudah. Tanpa trigger
  # pull_request, satu-satunya gerbang ada di main — yaitu setelah kode sudah
  # menempel di branch rilis.
  pull_request:
    paths:
      - "backend/**"
      - "bot/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gerbang kualitas. Sebelumnya workflow ini HANYA build-push: push ke main
  # langsung menerbitkan image :main dan :latest tanpa satu pun test dijalankan.
  # Job ini memblokir build bila build/vet/test gagal.
  test:
    name: test ${{ matrix.module }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [backend, bot]
    defaults:
      run:
        working-directory: ./${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./${{ matrix.module }}/go.mod
          cache-dependency-path: ./${{ matrix.module }}/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race: seluruh test bersifat unit murni (tidak butuh Postgres), tapi
      # limiter & klaim sync memakai state bersama — race detector menangkap
      # regresi konkurensi yang lolos di `go test` biasa.
      - name: go test -race
        run: go test -race ./...

  build-backend:
    name: build backend (ressist-api)
    needs: test
    # Pada pull_request cukup jalankan gerbang test: image tidak boleh
    # diterbitkan dari kode yang belum masuk main, dan login GHCR dari fork
    # tidak punya izin packages:write.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ressist-api
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  build-bot:
    name: build bot (ressist-bot)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (bot)
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ressist-bot
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          file: ./bot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: ${{ steps.meta-bot.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
