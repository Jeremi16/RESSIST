[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = ["bun install --frozen-lockfile --no-progress"]

[phases.build]
cmds = ["bun run build"]

[start]
# Single-serve: Hono BFF + dist/ statis dalam 1 proses Bun.
# (Mode utama = Vercel: static CDN + Functions, file ini tidak dipakai.)
cmd = "SERVE_STATIC=1 bun run server/index.ts"
