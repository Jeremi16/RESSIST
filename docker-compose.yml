# ressist — 3 deployable services (sejajar): frontend, backend (api), bot.
# api stateless (replicas N ok). bot SINGLE replica (telegram long-polling).
# Fix untuk "Conflict: terminated by other getUpdates": hanya container bot
# yang memegang TELEGRAM_BOT_TOKEN + polling. api TIDAK polling lagi.
name: ressist

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ressist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      POSTGRES_DB: ${DB_NAME:-ressist}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://${DB_USER:-ressist}:${DB_PASSWORD:?DB_PASSWORD wajib diisi}@db:5432/${DB_NAME:-ressist}?sslmode=disable
      AUTO_MIGRATE: "true"
      GIN_MODE: release
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?set BOT_SERVICE_TOKEN in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-student.itera.ac.id}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Sender-only (POST /v1/telegram/test-*). Polling stays in bot.
      # Sending from N processes is allowed; only getUpdates is exclusive.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ressist_bot}
      LMS_SYNC_ENABLED: ${LMS_SYNC_ENABLED:-true}
      LMS_SYNC_CRON: ${LMS_SYNC_CRON:-0 7 * * *}
      LMS_SYNC_BATCH_SIZE: ${LMS_SYNC_BATCH_SIZE:-200}
      LMS_SYNC_CONCURRENCY: ${LMS_SYNC_CONCURRENCY:-2}
      LMS_SYNC_TIMEOUT_SECONDS: ${LMS_SYNC_TIMEOUT_SECONDS:-90}
      # WAJIB diisi bila api berada di belakang reverse proxy / Coolify /
      # Traefik / nginx. Kosong = tidak ada proxy yang dipercaya, sehingga
      # c.ClientIP() mengembalikan IP proxy dan SEMUA pengguna terlihat
      # sebagai satu IP -> rate limit per-IP di bawah membagi satu kuota
      # untuk seluruh pengguna (429 massal). Isi dengan CIDR jaringan
      # internal proxy, contoh: 172.16.0.0/12,10.0.0.0/8.
      # Terlalu luas = klien bisa memalsukan X-Forwarded-For dan lolos limit.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Pre-auth limiter: membatasi request sebelum kredensial diverifikasi,
      # supaya flood anonim tidak memaksa sha256 + query DB per request.
      PREAUTH_RATE_LIMIT_PER_MINUTE: ${PREAUTH_RATE_LIMIT_PER_MINUTE:-300}
      PREAUTH_RATE_LIMIT_BURST: ${PREAUTH_RATE_LIMIT_BURST:-120}
      # Per-user sync limiter: satu budget dipakai bersama oleh
      # GET /v1/calendar/preview?force=true, POST /v1/calendar/test, dan
      # POST /v1/auth/sync. Klien sebaiknya memperlakukan 429 sebagai
      # terminal (baca retry_after_seconds), bukan sebagai retry.
      SYNC_RATE_LIMIT_PER_MINUTE: ${SYNC_RATE_LIMIT_PER_MINUTE:-6}
      SYNC_RATE_LIMIT_BURST: ${SYNC_RATE_LIMIT_BURST:-3}
      # Dashboard "test notification" buttons spend a shared operator quota.
      TELEGRAM_TEST_RATE_LIMIT_PER_MINUTE: ${TELEGRAM_TEST_RATE_LIMIT_PER_MINUTE:-5}
      TELEGRAM_TEST_RATE_LIMIT_BURST: ${TELEGRAM_TEST_RATE_LIMIT_BURST:-2}
      API_KEY_PREFIX: ${API_KEY_PREFIX:-rsk_}
      API_KEY_MAX_PER_USER: ${API_KEY_MAX_PER_USER:-5}
      API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-60}
      API_KEY_RATE_LIMIT_BURST: ${API_KEY_RATE_LIMIT_BURST:-20}
      # Legacy auth endpoints (login/callback/refresh). Per-IP, pre-auth.
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-10}
      # Retensi events: tanpa ini tabel events tumbuh tanpa batas.
      EVENT_RETENTION_ENABLED: ${EVENT_RETENTION_ENABLED:-true}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      EVENT_RETENTION_CRON: ${EVENT_RETENTION_CRON:-30 3 * * *}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-8080}/livez || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Stateless: boleh scale. Contoh: docker compose up -d --scale api=2
    # (pastikan di depan ada load balancer / reverse proxy)

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ENV: production
      BOT_PORT: "8081"
      API_BASE_URL: http://api:8080
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?set BOT_SERVICE_TOKEN in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ressist_bot}
    ports:
      - "${BOT_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/livez"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
    # JANGAN scale bot > 1. Satu poller saja, kalau tidak Telegram akan
    # me-return "Conflict: terminated by other getUpdates request".

  # Frontend (opsional di VPS; boleh deploy ke Vercel dan menunjuk ke api).
  # Komentar: uncomment jika ingin serve frontend dari compose yang sama.
  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   environment:
  #     BACKEND_URL: http://api:8080
  #   ports:
  #     - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
